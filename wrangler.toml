name = "tetonpasscam"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"

# Custom domains (require the tetonpasscam.com zone on this Cloudflare account)
routes = [
  { pattern = "tetonpasscam.com", custom_domain = true },
  { pattern = "www.tetonpasscam.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# SEO audit fix #2: without this, Cloudflare's assets layer serves a request
# matching a file on disk (the homepage's "/" -> index.html) directly,
# bypassing the Worker's fetch() entirely -- confirmed empirically via
# `wrangler dev` (CF-Cache-Status: HIT, no data-live-status div, none of our
# code ran at all).
#
# `run_worker_first` was first tried scoped to just `["/"]`, but that broke
# every /api/* route (404/405 -- verify-launch.sh caught it): with no
# `run_worker_first` at all, unmatched paths (no static file, e.g. /api/*)
# implicitly fall back to the Worker, which is how /api/* worked pre-SEO-T2.
# Setting an explicit array turns that implicit fallback off for paths NOT
# in the list, so /api/* stopped reaching the Worker at all. `true` routes
# every request through the Worker first instead -- index.ts's own routing
# already does the right thing for every path that isn't the homepage or
# /api/* (`return env.ASSETS.fetch(req)`), so this is behaviorally
# equivalent to the old default for those, just with the Worker as an extra
# (cheap) hop in front.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "tetonpasscam"
database_id = "8a763eb6-ec40-4db2-ae0b-501f137a12d6"

# share-cards T1: the /og PNG renderer (src/worker/card/fonts.ts) imports raw
# .woff font bytes directly (satori has no woff2 decompressor, so the app's
# usual self-hosted woff2 fonts can't be reused here -- see fonts.ts's own
# comment). Wrangler has no built-in rule for .woff (only .wasm/.txt/.html/
# .bin by default), so this makes `import x from '*.woff'` resolve to the
# raw file bytes as an ArrayBuffer at build time. `fallthrough = true` is
# required, not optional: defining ANY custom rule turns off wrangler's
# built-in default rules unless fallthrough is set, and the `workers-og`
# package's own internal `import ... from "./resvg-*.wasm"` (its bundled
# WASM renderer) depends on the default `*.wasm` -> CompiledWasm rule still
# applying.
[[rules]]
type = "Data"
globs = ["**/*.woff"]
fallthrough = true

[triggers]
# "*/10 11-6 * * *" would wrap around midnight UTC, which Cloudflare cron
# triggers do not support (ranges cannot wrap). Split into two entries that
# together cover the same 11:00 UTC-06:59 UTC window.
crons = ["*/10 11-23 * * *", "*/10 0-6 * * *", "0 7-10 * * *", "10 9 * * *"]

# Exposes the running deployment's id to the Worker. Used solely to scope the
# homepage cache key (see serveHomepage in src/worker/index.ts): without it, a
# deploy served the PREVIOUS build's injected index.html from caches.default
# for up to s-maxage=300 while that same deploy pruned the content-hashed
# assets that HTML points at -- a five-minute window after every deploy where
# a visitor got a 404 on the main bundle and saw only the static SEO shell.
[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
ADMIN_EMAIL = "drew@monroeresidential.com"
